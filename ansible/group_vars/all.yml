---
# Global variables for all hosts

# Versions
# K3s utilise le channel "stable" (même source que le System Upgrade Controller)
# Cela garantit que Ansible et SUC installent/ciblent toujours la même version.
k3s_channel: stable
# renovate: datasource=github-releases depName=kubernetes/kubernetes
kubectl_version: v1.36.4
# renovate: datasource=github-releases depName=helm/helm
helm_version: v4.2.4
# renovate: datasource=github-releases depName=helmfile/helmfile
helmfile_version: v1.7.4

# Network Configuration
k3s_master_ip: 192.168.1.102
k3s_api_port: 6443
traefik_metallb_ip: 192.168.1.151

# Paths
k3s_config_dir: /etc/rancher/k3s
k3s_data_dir: /var/lib/rancher/k3s
kubeconfig_local_path: ~/.kube/k3s-config

# Security
k3s_token_file: /var/lib/rancher/k3s/server/node-token
kubeconfig_permissions: "0600"

# Timeouts (in seconds)
service_start_timeout: 60
node_ready_timeout: 300
verification_timeout: 300
k3s_install_timeout: 300
master_connectivity_timeout: 300
retry_delay: 10

# System Dependencies
required_packages:
  - curl
  - ca-certificates
  - apt-transport-https
  - software-properties-common

# Kernel Modules
kernel_modules:
  - br_netfilter
  - overlay

# Sysctl Configuration
sysctl_config:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1

# Firewall Ports
firewall_ports_tcp:
  - 6443   # Kubernetes API
  - 10250  # Kubelet
  - 8472   # Flannel VXLAN
  - 22     # SSH
  - 80     # HTTP
  - 443    # HTTPS
  - "30000:32767" # NodePort range
  - 53     # DNS
  - 3000   # AdGuard Home Web UI
  - 9100   # Node Exporter (Prometheus metrics)
  - 7946   # MetalLB
  - 8123   # Home-Assistant (hostNetwork)

firewall_ports_udp:
  - 8472   # Flannel VXLAN
  - 51820  # Wireguard (for later)
  - 53     # DNS
  - 67     # DHCP server
  - 68     # DHCP client
  - 7946   # MetalLB
  - 6666   # LocalTuya (Home-Assistant)
  - 6667   # LocalTuya (Home-Assistant)

# Helmfile Configuration
helmfile_download_url: "https://github.com/helmfile/helmfile/releases/download/{{ helmfile_version }}/helmfile_{{ helmfile_version | regex_replace('^v', '') }}_linux_amd64.tar.gz"
helmfile_install_path: /usr/local/bin/helmfile

# Reports
cluster_report_path: /tmp/cluster_status.txt
