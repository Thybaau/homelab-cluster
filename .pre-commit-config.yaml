---
# Pre-commit hooks for homelab-cluster
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
# Update:  pre-commit autoupdate

repos:
  # === Generic hooks (fast, < 1s) ===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: ^helm/.*/templates/
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # === YAML linting (< 2s) ===
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['-c', '.yamllint.yml']
        exclude: ^helm/.*/templates/

  # === Shell linting (< 1s) ===
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

  # === Secret detection (2-5s) ===
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # === Ansible linting (5-15s) ===
  - repo: https://github.com/ansible/ansible-lint
    rev: v25.2.1
    hooks:
      - id: ansible-lint
        files: ^ansible/
        args: ['-c', '.ansible-lint']

  # === Local hooks (helm lint, kubeconform) ===
  - repo: local
    hooks:
      - id: helm-lint
        name: Helm Lint
        entry: bash -c 'for chart in helm/*/; do helm lint "$chart" || exit 1; done'
        language: system
        files: ^helm/
        pass_filenames: false

      - id: kubeconform
        name: Kubeconform - Validate K8s manifests
        entry: kubeconform -strict -ignore-missing-schemas
        language: system
        files: ^(argocd-apps/.*\.yml|root-app\.yml)$
        types: [yaml]
