---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kured
  namespace: argocd
  labels:
    app.kubernetes.io/name: kured
    app.kubernetes.io/component: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubereboot.github.io/charts
      targetRevision: "6.1.0"
      chart: kured
      helm:
        valueFiles:
          - $values/helm/kured/values.yaml
    - repoURL: https://github.com/Thybaau/homelab-cluster.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/Thybaau/homelab-cluster.git
      targetRevision: HEAD
      path: helm/kured
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
