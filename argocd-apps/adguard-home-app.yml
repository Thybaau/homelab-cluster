---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard-home
  namespace: argocd
  labels:
    app.kubernetes.io/name: adguard-home
    app.kubernetes.io/component: networking
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.gabe565.com
    targetRevision: 0.3.25
    chart: adguard-home
    helm:
      values: |
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet

        nodeSelector:
          kubernetes.io/hostname: k3s-worker-01

        env:
          TZ: "Europe/Paris"

        # Configuration DNS rewrites
        config: |
          dns:
            upstream_dns:
              - "https://dns10.quad9.net/dns-query"
              - "https://dns.cloudflare.com/dns-query"
          filtering:
            rewrites:
              - domain: "adguard.caremelle.org"
                answer: "192.168.1.151"
              - domain: "homepage.caremelle.org"
                answer: "192.168.1.151"
              - domain: "valhafin.caremelle.org"
                answer: "192.168.1.151"
              - domain: "grafana.caremelle.org"
                answer: "192.168.1.151"
              - domain: "argocd.caremelle.org"
                answer: "192.168.1.151"
              - domain: "ha.caremelle.org"
                answer: "192.168.1.151"

        service:
          main:
            type: ClusterIP
            ports:
              http:
                port: 3000
          dns-tcp:
            enabled: true
            type: LoadBalancer
            loadBalancerIP: "192.168.1.152"
            annotations:
              metallb.io/allow-shared-ip: adguard-home
            ports:
              dns-tcp:
                enabled: true
                port: 53
                protocol: TCP
          dns-udp:
            enabled: true
            type: LoadBalancer
            loadBalancerIP: "192.168.1.152"
            annotations:
              metallb.io/allow-shared-ip: adguard-home
            ports:
              dns-udp:
                enabled: true
                port: 53
                protocol: UDP

        ingress:
          main:
            enabled: true
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
            hosts:
              - host: adguard.caremelle.org
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      name: adguard-home
                      port: 3000

        persistence:
          config:
            enabled: true
            size: 1Gi
            storageClass: "local-path"
            accessMode: ReadWriteOnce
          data:
            enabled: true
            size: 5Gi
            storageClass: "local-path"
            accessMode: ReadWriteOnce
  destination:
    server: https://kubernetes.default.svc
    namespace: networking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
