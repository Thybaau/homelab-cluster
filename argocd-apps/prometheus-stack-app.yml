---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  labels:
    app.kubernetes.io/name: monitoring-stack
    app.kubernetes.io/component: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 72.6.2
      chart: kube-prometheus-stack
      helm:
        values: |
          crds:
            upgradeJob:
              enabled: true
          prometheus:
            prometheusSpec:
              retention: 7d
              retentionSize: "8GB"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 300m
                  memory: 768Mi
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 10Gi
          grafana:
            enabled: true
            admin:
              existingSecret: grafana-admin-credentials
              userKey: admin-user
              passwordKey: admin-password
            resources:
              limits:
                cpu: 150m
                memory: 256Mi
            persistence:
              enabled: true
              size: 2Gi
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
              hosts:
                - grafana.caremelle.org
              path: /
          alertmanager:
            enabled: true
            alertmanagerSpec:
              resources:
                requests:
                  memory: 64Mi
                limits:
                  memory: 256Mi
              storage:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 2Gi
              secrets:
                - discord-webhook-urls
            config:
              global:
                resolve_timeout: 5m
              route:
                receiver: discord-monitoring
                group_by: ['alertname', 'namespace']
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h
                routes:
                  - receiver: discord-critical
                    matchers:
                      - severity = critical
                    repeat_interval: 1h
                    continue: false
                  - receiver: discord-monitoring
                    matchers:
                      - severity = warning
                    repeat_interval: 4h
                    continue: false
              receivers:
                - name: discord-critical
                  webhook_configs:
                    - url_file: /etc/alertmanager/secrets/discord-webhook-urls/discord-critical-webhook-url
                      send_resolved: true
                - name: discord-monitoring
                  webhook_configs:
                    - url_file: /etc/alertmanager/secrets/discord-webhook-urls/discord-monitoring-webhook-url
                      send_resolved: true
              inhibit_rules:
                - source_matchers:
                    - severity = critical
                  target_matchers:
                    - severity = warning
                  equal: ['alertname', 'namespace']
            templateFiles:
              discord.tmpl: |-
                {{ define "discord.title" }}
                {{ if eq .Status "firing" }}
                {{ if .Alerts }}{{ if eq (index .Alerts 0).Labels.severity "critical" }}🚨 CRITIQUE{{ else }}⚠️ WARNING{{ end }}{{ else }}⚠️ WARNING{{ end }}
                {{ else }}✅ RÉSOLU{{ end }}
                {{ end }}
                {{ define "discord.text" }}
                {{ range .Alerts }}
                {{ .Annotations.summary }}
                Dashboard: {{ .Annotations.dashboard_url }}
                {{ end }}
                {{ end }}
    - repoURL: https://github.com/Thybaau/homelab-cluster.git
      targetRevision: HEAD
      path: helm/prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
