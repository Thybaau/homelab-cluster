---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  labels:
    app.kubernetes.io/name: monitoring-stack
    app.kubernetes.io/component: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 87.15.1
      chart: kube-prometheus-stack
      helm:
        values: |
          crds:
            enabled: true
            upgradeJob:
              enabled: false
          prometheus:
            prometheusSpec:
              retention: 7d
              retentionSize: "8GB"
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 10Gi
          kubeEtcd:
            enabled: false
          kubeControllerManager:
            enabled: false
          kubeProxy:
            enabled: false
          kubeScheduler:
            enabled: false
          nodeExporter:
            enabled: true
            operatingSystems:
              linux:
                enabled: true
              aix:
                enabled: false
              darwin:
                enabled: false
          grafana:
            enabled: true
            admin:
              existingSecret: grafana-admin-credentials
              userKey: admin-user
              passwordKey: admin-password
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 250m
                memory: 512Mi
            persistence:
              enabled: true
              size: 2Gi
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
              hosts:
                - grafana.caremelle.org
              path: /
            additionalDataSources:
              - name: Loki
                type: loki
                uid: loki
                url: http://loki.monitoring.svc:3100
                access: proxy
                isDefault: false
          alertmanager:
            enabled: true
            alertmanagerSpec:
              resources:
                requests:
                  memory: 64Mi
                limits:
                  memory: 256Mi
              storage:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 2Gi
              secrets:
                - discord-webhook-urls
            config:
              global:
                resolve_timeout: 5m
              route:
                receiver: discord-monitoring
                group_by: ['alertname', 'namespace']
                group_wait: 30s
                group_interval: 5m
                repeat_interval: 4h
                routes:
                  - receiver: 'null'
                    matchers:
                      - alertname = InfoInhibitor
                    continue: false
                  - receiver: discord-watchdog
                    matchers:
                      - alertname = Watchdog
                    repeat_interval: 4h
                    continue: false
                  - receiver: discord-critical
                    matchers:
                      - severity = critical
                    repeat_interval: 1h
                    continue: false
                  - receiver: discord-monitoring
                    matchers:
                      - severity = warning
                    repeat_interval: 4h
                    continue: false
              receivers:
                - name: 'null'
                - name: discord-watchdog
                  slack_configs:
                    - api_url_file: /etc/alertmanager/secrets/discord-webhook-urls/discord-watchdog-webhook-url
                      send_resolved: true
                      color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
                      title: '{{ if eq .Status "firing" }}⚠️ WARNING{{ else }}✅ RÉSOLU{{ end }}'
                      text: |-
                        {{ range .Alerts }}
                        *{{ .Labels.alertname }}* — {{ .Labels.namespace }}
                        {{ if .Annotations.description }}{{ .Annotations.description }}{{ else }}{{ .Annotations.summary }}{{ end }}
                        {{ if .Annotations.dashboard_url }}📊 <{{ .Annotations.dashboard_url }}|Dashboard>{{ end }}
                        {{ end }}
                - name: discord-critical
                  slack_configs:
                    - api_url_file: /etc/alertmanager/secrets/discord-webhook-urls/discord-critical-webhook-url
                      send_resolved: true
                      color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
                      title: '{{ if eq .Status "firing" }}🚨 CRITIQUE{{ else }}✅ RÉSOLU{{ end }}'
                      text: |-
                        {{ range .Alerts }}
                        *{{ .Labels.alertname }}* — {{ .Labels.namespace }}
                        {{ if .Annotations.description }}{{ .Annotations.description }}{{ else }}{{ .Annotations.summary }}{{ end }}
                        {{ if .Annotations.dashboard_url }}📊 <{{ .Annotations.dashboard_url }}|Dashboard>{{ end }}
                        {{ end }}
                - name: discord-monitoring
                  slack_configs:
                    - api_url_file: /etc/alertmanager/secrets/discord-webhook-urls/discord-monitoring-webhook-url
                      send_resolved: true
                      color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
                      title: '{{ if eq .Status "firing" }}⚠️ WARNING{{ else }}✅ RÉSOLU{{ end }}'
                      text: |-
                        {{ range .Alerts }}
                        *{{ .Labels.alertname }}* — {{ .Labels.namespace }}
                        {{ if .Annotations.description }}{{ .Annotations.description }}{{ else }}{{ .Annotations.summary }}{{ end }}
                        {{ if .Annotations.dashboard_url }}📊 <{{ .Annotations.dashboard_url }}|Dashboard>{{ end }}
                        {{ end }}
              inhibit_rules:
                - source_matchers:
                    - severity = critical
                  target_matchers:
                    - severity = warning
                  equal: ['alertname', 'namespace']
                - source_matchers:
                    - alertname = StorageCritical
                  target_matchers:
                    - alertname = StorageWarning
                  equal: ['instance']
          additionalPrometheusRulesMap:
            homelab-infrastructure:
              groups:
                - name: homelab-infrastructure.rules
                  rules:
                    - alert: StorageWarning
                      expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!=""} / node_filesystem_size_bytes{mountpoint="/",fstype!=""}) * 100 > 80
                      for: 10m
                      labels:
                        severity: warning
                      annotations:
                        summary: "Stockage du nœud {{ $labels.instance }} à {{ $value | humanize }}%"
                        dashboard_url: "https://grafana.caremelle.org/d/storage"
                    - alert: StorageCritical
                      expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!=""} / node_filesystem_size_bytes{mountpoint="/",fstype!=""}) * 100 > 90
                      for: 5m
                      labels:
                        severity: critical
                      annotations:
                        summary: "Stockage du nœud {{ $labels.instance }} à {{ $value | humanize }}% — seuil critique dépassé"
                        dashboard_url: "https://grafana.caremelle.org/d/storage"
                    - alert: NodeNotReady
                      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                      for: 3m
                      labels:
                        severity: critical
                      annotations:
                        summary: "Le nœud {{ $labels.node }} n'est plus en état Ready"
                        dashboard_url: "https://grafana.caremelle.org/d/cluster-overview"
                    - alert: PodCrashLooping
                      expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
                      for: 0m
                      labels:
                        severity: critical
                      annotations:
                        summary: "Le pod {{ $labels.namespace }}/{{ $labels.pod }} redémarre en boucle"
                        dashboard_url: "https://grafana.caremelle.org/d/cluster-overview"
                    - alert: PodHighMemoryUsage
                      expr: (container_memory_working_set_bytes{container!=""} / on(namespace,pod,container) kube_pod_container_resource_limits{resource="memory",container!=""}) * 100 > 85
                      for: 10m
                      labels:
                        severity: warning
                      annotations:
                        summary: "Le pod {{ $labels.namespace }}/{{ $labels.pod }} utilise {{ $value | humanize }}% de sa limite mémoire"
                        dashboard_url: "https://grafana.caremelle.org/d/cluster-overview"
                    - alert: PodHighCpuUsage
                      expr: (rate(container_cpu_usage_seconds_total{container!=""}[5m]) / on(namespace,pod,container) kube_pod_container_resource_limits{resource="cpu",container!=""}) * 100 > 90
                      for: 10m
                      labels:
                        severity: warning
                      annotations:
                        summary: "Le pod {{ $labels.namespace }}/{{ $labels.pod }} utilise {{ $value | humanize }}% de sa limite CPU"
                        dashboard_url: "https://grafana.caremelle.org/d/cluster-overview"
            # REQUIRES: blackbox-exporter (Story 4.1) — règle dormante tant que probe_success n'existe pas
            homelab-services:
              groups:
                - name: homelab-services.rules
                  rules:
                    - alert: ServiceDown
                      expr: probe_success == 0
                      for: 5m
                      labels:
                        severity: critical
                      annotations:
                        summary: "Le service {{ $labels.instance }} ne répond plus (probe HTTP en échec)"
                        dashboard_url: "https://grafana.caremelle.org/d/cluster-overview"
            homelab-alerting-health:
              groups:
                - name: homelab-alerting-health.rules
                  rules:
                    - alert: AlertmanagerFailedNotifications
                      expr: increase(alertmanager_notifications_failed_total[15m]) > 1
                      for: 0m
                      labels:
                        severity: critical
                      annotations:
                        summary: "Alertmanager n'a pas réussi à envoyer des notifications ({{ $value | humanize }} échecs en 15 min)"
                        dashboard_url: "https://grafana.caremelle.org/d/cluster-overview"
            homelab-upgrades:
              groups:
                - name: homelab-upgrades.rules
                  rules:
                    - alert: K3sNodeUpgraded
                      expr: changes(kube_node_info[15m]) > 0
                      for: 0m
                      labels:
                        severity: warning
                      annotations:
                        summary: "🔄 Nœud {{ $labels.node }} upgradé vers K3s {{ $labels.kubelet_version }}"
                        description: "Le nœud {{ $labels.node }} a changé de version K3s (nouvelle version : {{ $labels.kubelet_version }})"
                    - alert: K3sUpgradeJobFailed
                      expr: kube_job_status_failed{namespace="system-upgrade", job_name=~"apply-.*-plan.*"} > 0
                      for: 1m
                      labels:
                        severity: critical
                      annotations:
                        summary: "❌ Upgrade K3s échoué — Job {{ $labels.job_name }}"
                        description: "Le Job d'upgrade {{ $labels.job_name }} a échoué dans le namespace system-upgrade"
    - repoURL: https://github.com/Thybaau/homelab-cluster.git
      targetRevision: HEAD
      path: helm/prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
