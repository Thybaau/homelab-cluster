---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-dashboard
  namespace: argocd
  labels:
    app.kubernetes.io/name: hermes-dashboard
    app.kubernetes.io/component: dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Thybaau/homelab-cluster.git
    targetRevision: HEAD
    path: helm/hermes-dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
