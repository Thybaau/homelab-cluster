apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "hermes-dashboard.fullname" . }}-host-rewrite
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hermes-dashboard.labels" . | nindent 4 }}
spec:
  headers:
    customRequestHeaders:
      Host: "{{ .Values.externalService.ip }}:{{ .Values.externalService.port }}"
      Origin: "http://{{ .Values.externalService.ip }}:{{ .Values.externalService.port }}"
