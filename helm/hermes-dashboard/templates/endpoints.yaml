apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ include "hermes-dashboard.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hermes-dashboard.labels" . | nindent 4 }}
    kubernetes.io/service-name: {{ include "hermes-dashboard.fullname" . }}
addressType: IPv4
ports:
  - port: {{ .Values.externalService.port }}
    protocol: {{ .Values.externalService.protocol }}
endpoints:
  - addresses:
      - {{ .Values.externalService.ip | quote }}
