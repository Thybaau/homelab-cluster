apiVersion: v1
kind: Endpoints
metadata:
  # CRITIQUE : le nom DOIT être identique au nom du Service
  name: {{ include "hermes-dashboard.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "hermes-dashboard.labels" . | nindent 4 }}
subsets:
  - addresses:
      - ip: {{ .Values.externalService.ip }}
    ports:
      - port: {{ .Values.externalService.port }}
        protocol: {{ .Values.externalService.protocol }}
