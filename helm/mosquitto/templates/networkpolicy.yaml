# Limite l'accès au broker (le reste du namespace home-assistant n'est pas isolé).
# Autorisés : pods du namespace (Zigbee2MQTT) et IPs des nœuds (Home Assistant en hostNetwork).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mosquitto-allow-clients
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/component: mqtt-broker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.allowedNodeIPs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 1883
