apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.sealedSecret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/component: mqtt-broker
  annotations:
    # Avant le Deployment (wave 0), qui monte ce Secret
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    passwd: {{ .Values.sealedSecret.encryptedData.passwd | quote }}
  template:
    type: Opaque
    metadata:
      name: {{ .Values.sealedSecret.name }}
      namespace: {{ .Values.namespace }}
