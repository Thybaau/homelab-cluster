---
# Mosquitto - broker MQTT (Zigbee2MQTT <-> Home Assistant)
# Namespace : home-assistant (commun avec HA et Zigbee2MQTT)

namespace: home-assistant

image:
  repository: eclipse-mosquitto
  tag: 2.0.22
  pullPolicy: IfNotPresent

# Persistance (messages retained, état des abonnements)
persistence:
  size: 1Gi
  storageClass: local-path

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Secret scellé contenant le fichier `passwd` (mots de passe hachés).
# Utilisateurs : zigbee2mqtt, homeassistant
# Régénération : voir helm/mosquitto/README.md
sealedSecret:
  name: mosquitto-auth
  encryptedData:
    passwd: 

# Sources autorisées à joindre le broker sur 1883, en plus des pods du namespace.
# Home Assistant tourne en hostNetwork : son trafic arrive avec l'IP du nœud.
networkPolicy:
  allowedNodeIPs:
    # IPs LAN des nœuds
    - 192.168.0.102/32
    - 192.168.0.103/32
    # Interface flannel.1 de chaque nœud (podCIDR .0) : source vue par le broker
    # quand un pod hostNetwork (HA sur le worker) joint un pod d'un autre nœud
    - 10.42.0.0/32
    - 10.42.1.0/32
    # Passerelle cni0 de chaque nœud (podCIDR .1) : trafic hostNetwork du même nœud
    - 10.42.0.1/32
    - 10.42.1.1/32
