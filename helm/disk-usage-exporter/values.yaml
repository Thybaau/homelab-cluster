---
# Configuration globale
global:
  namespace: monitoring

# Configuration de l'application
app:
  image:
    repository: deziss/du_exporter
    tag: "v0.6.0"
    pullPolicy: IfNotPresent

  # Port d'écoute de l'exporter
  port: 9995

  # Chemins à analyser avec leur profondeur respective
  # Format: path=level (relatif au hostPath monté sur /host)
  # Seuls les chemins réellement volumineux et actionnables sont surveillés
  multiPaths:
    /host/var/lib/rancher/k3s/agent/containerd: 1  # ~14 GB — images/layers
    /host/var/lib/rancher/k3s/storage: 1            # ~4 GB — PVCs
    /host/var/log: 1                                # ~800 MB — journal/pods
    /host/var/lib/rancher/k3s/data: 1               # ~700 MB — binaires K3s

  # Dossiers à ignorer lors de l'analyse
  ignoreDirs:
    - /proc
    - /dev
    - /sys
    - /run

  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Security context au niveau du pod
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  # Security context au niveau du conteneur
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: false
    runAsUser: 0
    capabilities:
      drop: ["ALL"]
      add: ["DAC_READ_SEARCH"]

# Configuration du ServiceMonitor Prometheus
serviceMonitor:
  enabled: true
  scrapeInterval: 5m
  scrapeTimeout: 60s
