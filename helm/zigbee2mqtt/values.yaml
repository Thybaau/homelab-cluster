---
# Zigbee2MQTT - values pour le chart officiel (https://charts.zigbee2mqtt.io)
# Déployé via ArgoCD multi-sources (voir argocd-apps/zigbee2mqtt-app.yml)
# Coordinateur : SMLIGHT SLZB-MR1U en TCP (pas de passthrough USB, pas de privileged)

# Le chart prend appVersion (2.14.3) comme tag d'image : suivi via targetRevision.

service:
  # Défaut du chart = LoadBalancer (prendrait une IP MetalLB) : ClusterIP + Traefik
  type: ClusterIP
  port: 8080

statefulset:
  replicas: 1
  # Ne pas fixer de nœud : le dongle est joint en TCP.
  # Le PVC local-path collera le pod au nœud choisi au premier démarrage.
  nodeSelector: {}

  storage:
    enabled: true
    size: 1Gi
    storageClassName: local-path

  # secret.yaml monté depuis le SealedSecret ci-dessous (clé MQTT, network_key, token UI)
  secrets:
    name: zigbee2mqtt-secret

  # Le défaut du chart (600Mi de requête) est trop pour le worker (4 Go)
  resources:
    requests:
      cpu: 50m
      memory: 200Mi
    limits:
      memory: 400Mi

  # Pas de privileged ni SYS_ADMIN (inutiles avec un coordinateur TCP)
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      add: null
      drop: [ALL]

# L'init container yq écrit configuration.yaml : même utilisateur que Z2M
secretesMigratorContainer:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

zigbee2mqtt:
  timezone: Europe/Paris
  permit_join: false

  homeassistant:
    enabled: true
    discovery_topic: homeassistant
    status_topic: hass/status

  mqtt:
    server: mqtt://mosquitto.home-assistant.svc.cluster.local:1883
    user: '!secret mqtt_user'
    password: '!secret mqtt_password'
    version: 5

  serial:
    # SLZB-MR1U (192.168.0.35, réservation DHCP) : radio 2 = CC2652P7 en Zigbee Coordinator,
    # socket TCP 7638, firmware Z-Stack. La radio 1 (EFR32MG21, port 6638) est dédiée à Thread.
    port: tcp://192.168.0.35:7638
    adapter: zstack
    disable_led: false

  frontend:
    enabled: true
    port: 8080
    auth_token: '!secret auth_token'

  advanced:
    # Canal Zigbee : le changer impose de ré-appairer tous les appareils.
    # 25 = hors des canaux Wi-Fi 1/6/11.
    channel: 25
    network_key: '!secret network_key'
    log_output:
      - console
    log_level: info

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: z2m.caremelle.org
      paths:
        - path: /
          pathType: Prefix
  tls: []

extraResources:
  - apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: zigbee2mqtt-secret
      namespace: home-assistant
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      encryptedData:
        secret.yaml: 
      template:
        type: Opaque
        metadata:
          name: zigbee2mqtt-secret
          namespace: home-assistant
