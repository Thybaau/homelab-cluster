{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.defaultDeny.enabled }}
# NetworkPolicy default-deny : bloque tout trafic ingress dans le namespace valhafin.
# Les flux légitimes sont autorisés par des NetworkPolicies spécifiques (database, backend, frontend).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "valhafin.fullname" . }}-default-deny
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "valhafin.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
{{- end }}
