---
# Configuration de la connexion PostgreSQL
config:
  datasource:
    host: "valhafin-database.valhafin.svc"
    port: "5432"
    user: ""
    password: ""
    database: ""
    sslmode: "disable"
  datasourceSecret:
    name: "postgres-exporter-credentials"
    key: "DATA_SOURCE_NAME"

# ServiceMonitor pour la découverte Prometheus
serviceMonitor:
  enabled: true
  labels:
    release: monitoring-stack
  interval: 60s
  scrapeTimeout: 30s

# Resources
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 30m
    memory: 64Mi

# Réplicas
replicaCount: 1

# Security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

# SealedSecret pour les credentials PostgreSQL
sealedSecret:
  enabled: true
  encryptedData:
    DATA_SOURCE_NAME: ""
