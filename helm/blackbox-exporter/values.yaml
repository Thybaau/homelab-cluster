---
# Configuration des modules de probes
config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: "ip4"

# ServiceMonitor pour la découverte Prometheus
serviceMonitor:
  enabled: true
  defaults:
    labels:
      release: monitoring-stack
    interval: 60s
    scrapeTimeout: 30s
  targets:
    - name: valhafin-backend
      url: http://valhafin-backend.valhafin.svc:8080/health
      interval: 60s
    - name: homepage-external
      url: https://homepage.caremelle.org
      interval: 60s
    - name: homepage
      url: http://homepage.homepage.svc:3000
      interval: 60s
    - name: adguard-home
      url: http://adguard-home.networking.svc:3000
      interval: 60s
    - name: home-assistant
      url: https://ha.caremelle.org
      interval: 60s
    - name: home-assistant-local
      url: http://home-assistant.home-assistant.svc:8123
      interval: 60s

# Resources
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 50m
    memory: 64Mi

# Réplicas
replicas: 1

# Security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
