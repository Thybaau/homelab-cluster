---
# CronJob that runs on every node to clean orphaned K3s data directories.
# After each K3s upgrade, old binary/data dirs (~230MB each) remain in
# /var/lib/rancher/k3s/data/. This job removes any that are NOT referenced
# by the 'current' or 'previous' symlinks.
#
# Uses a hostPath volume mount — no nsenter, no privilege escalation beyond
# the mounted path. readlink works because symlinks in K3s data dir use
# relative targets after extraction.
{{- range .Values.cleanup.nodes }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-data-cleanup-{{ . }}
  namespace: system-upgrade
  labels:
    app.kubernetes.io/name: system-upgrade-controller
    app.kubernetes.io/component: data-cleanup
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: {{ $.Values.cleanup.schedule | quote }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      template:
        spec:
          nodeName: {{ . }}
          restartPolicy: Never
          serviceAccountName: system-upgrade
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: {{ $.Values.cleanup.image }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  DATA_DIR="/host-data"

                  # Symlinks in K3s data dir use absolute paths on the host.
                  # We only need the basename (hash) to compare directory names.
                  CURRENT=$(readlink "$DATA_DIR/current" 2>/dev/null | xargs basename 2>/dev/null || true)
                  PREVIOUS=$(readlink "$DATA_DIR/previous" 2>/dev/null | xargs basename 2>/dev/null || true)

                  if [ -z "$CURRENT" ]; then
                    echo "ERROR: Cannot resolve 'current' symlink, aborting to avoid data loss."
                    exit 1
                  fi

                  echo "Protecting: current=$CURRENT previous=$PREVIOUS"

                  CLEANED=0
                  for dir in "$DATA_DIR"/*/; do
                    [ -d "$dir" ] || continue
                    name=$(basename "$dir")
                    # Never touch cni, current target, or previous target
                    if [ "$name" = "cni" ] || [ "$name" = "$CURRENT" ] || [ "$name" = "$PREVIOUS" ]; then
                      continue
                    fi
                    echo "Removing orphaned: $name"
                    rm -rf "$dir"
                    CLEANED=$((CLEANED + 1))
                  done

                  echo "Done. Removed $CLEANED orphaned director(ies)."
              volumeMounts:
                - name: k3s-data
                  mountPath: /host-data
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
          volumes:
            - name: k3s-data
              hostPath:
                path: /var/lib/rancher/k3s/data
                type: Directory
{{- end }}
