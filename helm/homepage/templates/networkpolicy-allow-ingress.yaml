{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.allowIngress.enabled }}
# NetworkPolicy allow-ingress : autorise le trafic ingress depuis Traefik (namespace kube-system)
# vers homepage sur le port 3000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "homepage.fullname" . }}-allow-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "homepage.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
