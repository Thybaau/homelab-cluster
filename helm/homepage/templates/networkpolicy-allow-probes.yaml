{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.allowProbes.enabled }}
# NetworkPolicy allow-probes : autorise le trafic ingress depuis blackbox-exporter (namespace monitoring)
# vers homepage sur le port 3000 (probes HTTP).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "homepage.fullname" . }}-allow-probes
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "homepage.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000
{{- end }}
