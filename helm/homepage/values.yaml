---
# Configuration globale
global:
  namespace: homepage

# Configuration de l'application
app:
  # Nombre de réplicas (1 pour usage homelab)
  replicaCount: 1
  # Anciens ReplicaSets conservés pour rollback (défaut K8s : 10)
  revisionHistoryLimit: 2

  # Configuration de l'image Docker
  image:
    repository: ghcr.io/gethomepage/homepage
    tag: "v2.1.2"
    pullPolicy: IfNotPresent

  # Ressources allouées au pod
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Probe de vivacité (redémarre le pod si échec)
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  # Probe de disponibilité (retire du service si échec)
  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Stratégie de mise à jour
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # Délai de grâce avant arrêt forcé
  terminationGracePeriodSeconds: 30

  # Security context au niveau du pod
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Security context au niveau du conteneur
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # Security context pour l'initContainer busybox
  initSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # Host aliases pour résolution DNS interne (services hostNetwork)
  hostAliases:
    - ip: "192.168.0.151"
      hostnames:
        - ha.caremelle.org
        - valhafin.caremelle.org
        - hermes.caremelle.org

# Configuration du service
service:
  type: ClusterIP
  port: 3000

# Configuration de l'ingress
ingress:
  enabled: true
  className: traefik

  # Annotations spécifiques à Traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure

  # Hôtes et chemins
  hosts:
    - host: homepage.caremelle.org
      paths:
        - path: /
          pathType: Prefix

  # Configuration TLS
  tls:
    enabled: false

# Configuration du ServiceAccount
serviceAccount:
  # Créer un ServiceAccount dédié pour les permissions RBAC
  enabled: true
  # Nom du ServiceAccount (si vide, utilise le nom du chart)
  name: ""

# Configuration de la persistence
persistence:
  # Désactivée par défaut (configuration via ConfigMap uniquement)
  enabled: false
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce

# Configuration Homepage
config:
  # Settings généraux de l'interface
  settings:
    title: "Homelab Dashboard"
    theme: dark
    color: slate
    headerStyle: boxed

  # Fond d'écran (fichier dans helm/homepage/files/, servi depuis /app/public/images)
  # Doit rester < 1 MiB (limite d'un ConfigMap)
  background:
    enabled: true
    file: vinland.jpg
    blur: sm
    brightness: 50
    opacity: 100
    cardBlur: md

  # Widget Proxmox
  proxmox:
    enabled: true
    url: "https://192.168.0.200:8006"
    # Les credentials sont injectés via le SealedSecret homepage-proxmox

  # Widget ArgoCD
  argocd:
    enabled: true
    url: "http://argocd-server.argocd.svc.cluster.local"
    href: "https://argocd.caremelle.org"
    # Le token est injecté via le SealedSecret homepage-argocd

  # Cartes ajoutées au groupe Infrastructure (après Proxmox et ArgoCD, générés par le template)
  groupExtras:
    infrastructure:
      - Grafana:
          icon: grafana.png
          href: https://grafana.caremelle.org
          description: Cluster monitoring et dashboards
          siteMonitor: http://monitoring-stack-grafana.monitoring.svc.cluster.local
          widget:
            type: grafana
            version: 2
            url: http://monitoring-stack-grafana.monitoring.svc.cluster.local
            username: admin
            password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
      - AWS:
          icon: aws
          href: https://810585352236-l6vlemfz.eu-west-3.console.aws.amazon.com/console/home?region=eu-west-3
          description: Compte AWS Perso

  # Groupes suivants (ajoutés à services.yaml après Infrastructure)
  # Groupe parent « Services » : sous-groupes Network, Maison, Apps, GitHub (4 colonnes sous la ligne Infrastructure)
  customServices:
    - Services:
        - Network:
            - Routeur TP-Link:
                icon: tp-link.png
                href: http://192.168.0.1
                description: Interface d'administration du routeur
                siteMonitor: http://192.168.0.1
            - AdGuard Home:
                icon: adguard-home.png
                href: https://adguard.caremelle.org
                description: DNS et blocage de publicités
                siteMonitor: http://adguard-home.networking.svc.cluster.local:3000
                widget:
                  type: adguard
                  url: http://adguard-home.networking.svc.cluster.local:3000
            - Cloudflare Tunnel:
                icon: cloudflare.png
                href: https://one.dash.cloudflare.com/6226b1ff3a046ada22261bc31625fb45/networks/tunnels
                description: Tunnel Cloudflare Zero Trust
                widget:
                  type: cloudflared
                  accountid: 6226b1ff3a046ada22261bc31625fb45
                  tunnelid: 7c0f893a-1d76-48dc-a3fb-b5cfe10b4fc8
                  key: "{{HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_KEY}}"
            - Tailscale:
                icon: tailscale.png
                href: https://login.tailscale.com/admin/machines
                description: VPN
                widget:
                  type: tailscale
                  deviceid: nvDedqhweU11CNTRL
                  key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
                  fields: ["address", "last_seen", "expires"]
        - Maison:
            - Home Assistant:
                icon: home-assistant.png
                href: https://ha.caremelle.org
                description: Domotique et automatisation
                siteMonitor: https://ha.caremelle.org
                widget:
                  type: homeassistant
                  url: https://ha.caremelle.org
                  key: "{{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}"
                  fields: ["people_home", "lights_on", "switches_on"]
            - J.A.R.O.D.:
                icon: mdi-robot
                href: https://hermes.caremelle.org
                description: Dashboard de l'agent IA
                siteMonitor: https://hermes.caremelle.org
        - Apps:
            - Valhafin:
                icon: mdi-finance
                href: https://valhafin.caremelle.org
                description: Gestion comptes de finance
                siteMonitor: https://valhafin.caremelle.org
            - Pâtisseries Caremelle:
                icon: mdi-cake
                href: https://patisseries.caremelle.org
                description: Site de pâtisseries
                siteMonitor: https://patisseries.caremelle.org
        - GitHub:
            - homelab-cluster:
                icon: github.png
                href: https://github.com/Thybaau/homelab-cluster
                description: Configuration Kubernetes du homelab
            - homelab-infra-iac:
                icon: github.png
                href: https://github.com/Thybaau/homelab-infra-iac
                description: Infrastructure des VM du homelab
            - valhafin:
                icon: github.png
                href: https://github.com/Thybaau/valhafin
                description: App gestion de comptes de finance

  # Widgets personnalisés (ajoutés à widgets.yaml)
  customWidgets: []

# Labels personnalisés appliqués à toutes les ressources
customLabels: {}

# Annotations personnalisées appliquées à toutes les ressources
customAnnotations: {}

# Configuration des NetworkPolicies
networkPolicy:
  enabled: true

  # Bloque tout trafic ingress par défaut dans le namespace
  defaultDeny:
    enabled: true

  # Autorise le trafic ingress depuis Traefik (kube-system) vers homepage
  allowIngress:
    enabled: true

  # Autorise le trafic ingress depuis blackbox-exporter (monitoring) vers homepage pour les probes HTTP
  allowProbes:
    enabled: true
