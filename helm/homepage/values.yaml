---
# Configuration globale
global:
  namespace: homepage

# Configuration de l'application
app:
  # Nombre de réplicas (1 pour usage homelab)
  replicaCount: 1

  # Configuration de l'image Docker
  image:
    repository: ghcr.io/gethomepage/homepage
    tag: "v1.13.2"
    pullPolicy: IfNotPresent

  # Ressources allouées au pod
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Probe de vivacité (redémarre le pod si échec)
  livenessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  # Probe de disponibilité (retire du service si échec)
  readinessProbe:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Stratégie de mise à jour
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # Délai de grâce avant arrêt forcé
  terminationGracePeriodSeconds: 30

  # Security context au niveau du pod
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Security context au niveau du conteneur
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # Security context pour l'initContainer busybox
  initSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # Host aliases pour résolution DNS interne (services hostNetwork)
  hostAliases:
    - ip: "192.168.1.151"
      hostnames:
        - ha.caremelle.org

# Configuration du service
service:
  type: ClusterIP
  port: 3000

# Configuration de l'ingress
ingress:
  enabled: true
  className: traefik

  # Annotations spécifiques à Traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure

  # Hôtes et chemins
  hosts:
    - host: homepage.caremelle.org
      paths:
        - path: /
          pathType: Prefix

  # Configuration TLS
  tls:
    enabled: false

# Configuration du ServiceAccount
serviceAccount:
  # Créer un ServiceAccount dédié pour les permissions RBAC
  enabled: true
  # Nom du ServiceAccount (si vide, utilise le nom du chart)
  name: ""

# Configuration de la persistence
persistence:
  # Désactivée par défaut (configuration via ConfigMap uniquement)
  enabled: false
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce

# Configuration Homepage
config:
  # Settings généraux de l'interface
  settings:
    title: "Homelab Dashboard"
    theme: dark
    color: slate
    headerStyle: boxed

  # Widget Proxmox
  proxmox:
    enabled: true
    url: "https://192.168.1.200:8006"
    # Les credentials sont injectés via le SealedSecret homepage-proxmox

  # Widget ArgoCD
  argocd:
    enabled: true
    url: "http://argocd-server.argocd.svc.cluster.local"
    href: "https://argocd.caremelle.org"
    # Le token est injecté via le SealedSecret homepage-argocd

  # Services personnalisés (ajoutés à services.yaml)
  # Ordre : Monitoring, Network, Home Assistant, Applications
  customServices:
    - Monitoring:
        - Grafana:
            icon: grafana.png
            href: https://grafana.caremelle.org
            description: Cluster monitoring et dashboards
            widget:
              type: grafana
              version: 2
              url: http://monitoring-stack-grafana.monitoring.svc.cluster.local
              username: admin
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
    - Network:
        - AdGuard Home:
            icon: adguard-home.png
            href: https://adguard.caremelle.org
            description: DNS et blocage de publicités
            widget:
              type: adguard
              url: http://adguard-home.networking.svc.cluster.local:3000
        - Tailscale:
            icon: tailscale.png
            href: https://login.tailscale.com/admin/machines
            description: VPN
            widgets:
              - type: tailscale
                label: Proxmox Server
                deviceid: nvDedqhweU11CNTRL
                key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
                fields: ["address", "last_seen", "expires"]
              - type: tailscale
                label: Macbook
                deviceid: nAABgZk8me11CNTRL
                key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
                fields: ["address", "last_seen", "expires"]
              - type: tailscale
                label: PC Gaming
                deviceid: nouBQ4Qe3i11CNTRL
                key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
                fields: ["address", "last_seen", "expires"]
    - Home Assistant:
        - Home Assistant:
            icon: home-assistant.png
            href: https://ha.caremelle.org
            description: Domotique et automatisation
            widget:
              type: homeassistant
              url: https://ha.caremelle.org
              key: "{{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}"
              fields: ["people_home", "lights_on", "switches_on"]
    - Applications:
        - Valhafin:
            icon: mdi-finance
            href: https://valhafin.caremelle.org
            description: Gestion comptes de finance
        - Pâtisseries Caremelle:
            icon: mdi-cake
            href: https://patisseries.caremelle.org
            description: Site de pâtisseries

  # Widgets personnalisés (ajoutés à widgets.yaml)
  customWidgets: []

# Labels personnalisés appliqués à toutes les ressources
customLabels: {}

# Annotations personnalisées appliquées à toutes les ressources
customAnnotations: {}

# Configuration des NetworkPolicies
networkPolicy:
  enabled: true

  # Bloque tout trafic ingress par défaut dans le namespace
  defaultDeny:
    enabled: true

  # Autorise le trafic ingress depuis Traefik (kube-system) vers homepage
  allowIngress:
    enabled: true

  # Autorise le trafic ingress depuis blackbox-exporter (monitoring) vers homepage pour les probes HTTP
  allowProbes:
    enabled: true
