---
# ArgoCD Notifications configuration
# Utilise le service webhook avec Discord.
# Le fichier est séparé de helmfile.yaml car les templates Go ArgoCD
# ({{ .app.metadata.name }}) entrent en conflit avec le templating helmfile.
notifications:
  secret:
    # Le secret argocd-notifications-secret est géré par le chart argocd-config (SealedSecret)
    create: false
  notifiers:
    service.webhook.discord: |
      url: $discord-webhook-url
      headers:
      - name: Content-Type
        value: application/json
  templates:
    template.app-sync-succeeded: |
      webhook:
        discord:
          method: POST
          body: |
            {"embeds": [{"title": "✅ {{.app.metadata.name}}", "description": "Sync réussi → {{.app.status.sync.revision}}", "color": 3066993}]}
    template.app-sync-failed: |
      webhook:
        discord:
          method: POST
          body: |
            {"embeds": [{"title": "❌ {{.app.metadata.name}}", "description": "Sync échoué: {{.app.status.operationState.message}}", "color": 15158332}]}
    template.app-health-degraded: |
      webhook:
        discord:
          method: POST
          body: |
            {"embeds": [{"title": "⚠️ {{.app.metadata.name}}", "description": "Santé dégradée ({{.app.status.health.status}})", "color": 16776960}]}
  triggers:
    trigger.on-sync-succeeded: |
      - description: Application syncing has succeeded
        send: [app-sync-succeeded]
        when: app.status.operationState.phase in ['Succeeded']
    trigger.on-sync-failed: |
      - description: Application syncing has failed
        send: [app-sync-failed]
        when: app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-health-degraded: |
      - description: Application has degraded
        send: [app-health-degraded]
        when: app.status.health.status == 'Degraded'
  # Le recipient pour un webhook est juste le nom (pas "webhook:discord")
  subscriptions:
    - recipients:
        - discord
      triggers:
        - on-sync-succeeded
        - on-sync-failed
        - on-health-degraded
