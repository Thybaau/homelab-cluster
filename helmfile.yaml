---
# Helmfile manifest for k3s cluster infrastructure components

repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  # ArgoCD - GitOps continuous delivery tool
  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 9.5.21
    installed: true
    createNamespace: true
    wait: true
    timeout: 600
    values:
      - global:
          domain: argocd.caremelle.org
      - server:
          service:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
      - configs:
          params:
            server.insecure: true
          cm:
            # Crée le compte 'homepage' avec autoristation de générer des API Keys
            accounts.homepage: apiKey
          rbac:
            # Lecture seule (get) sur les applications
            policy.csv: |
              p, role:homepage-read-only, applications, get, */*, allow
              g, homepage, role:homepage-read-only
      # Notifications — config dans un fichier séparé (évite conflit templating helmfile/Go)
      - argocd-notifications-values.yaml
